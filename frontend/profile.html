<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - Clothify</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        CLOTHIFY
    </a>

    <ul class="nav-links">

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

        <li>
            <a href="products.html">
                Shop
            </a>
        </li>

        <li>
            <a href="orders.html">
                Orders
            </a>
        </li>

    </ul>

</header>


<div class="form-container">

    <h1>My Profile</h1>

    <div class="form-group">

        <label>Name</label>

        <input
            id="profile-name"
            type="text"
            readonly
        >

    </div>


    <div class="form-group">

        <label>Email</label>

        <input
            id="profile-email"
            type="email"
            readonly
        >

    </div>


    <div class="form-group">

        <label>Phone</label>

        <input
            id="profile-phone"
            type="text"
            readonly
        >

    </div>


    <div class="form-group">

        <label>Address</label>

        <textarea
            id="profile-address"
            readonly
        ></textarea>

    </div>


    <button
        class="form-button"
        onclick="logout()"
    >
        Logout
    </button>

</div>


<script src="js/main.js"></script>

</body>

</html>
