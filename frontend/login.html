<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Clothify</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="form-container">

    <h1>Welcome Back</h1>

    <form onsubmit="loginUser(event)">

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >

        </div>


        <button
            type="submit"
            class="form-button"
        >
            Login
        </button>

    </form>


    <p style="margin-top:20px;">

        Don't have an account?

        <a
            href="register.html"
            style="text-decoration:underline;"
        >
            Register
        </a>

    </p>

</div>


<script src="js/main.js"></script>

</body>

</html>
