<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Clothify</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="form-container">

    <h1>Create Account</h1>

    <form onsubmit="registerUser(event)">

        <div class="form-group">

            <label>Name</label>

            <input
                type="text"
                name="name"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input
                type="tel"
                name="phone"
            >

        </div>


        <div class="form-group">

            <label>Address</label>

            <textarea
                name="address"
                rows="3"
            ></textarea>

        </div>


        <button
            type="submit"
            class="form-button"
        >
            Create Account
        </button>

    </form>


    <p style="margin-top:20px;">

        Already have an account?

        <a
            href="login.html"
            style="text-decoration:underline;"
        >
            Login
        </a>

    </p>

</div>


<script src="js/main.js"></script>

</body>

</html>
